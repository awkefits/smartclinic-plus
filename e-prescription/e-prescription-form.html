<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Prescription</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>E-Prescription</h1>
      <div class="sub">Prescription form — linked to a patient and prescribing doctor</div>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">Dark mode</button>
  </div>

  <form id="rxForm">
    <div class="grid">
      <div class="panel">
        <h2>Patient</h2>
        <div class="field">
          <label class="req">Full name</label>
          <input type="text" id="patientName" required>
        </div>
        <div class="field">
          <label class="req">Date of birth</label>
          <input type="date" id="patientDob" required>
        </div>
        <div class="field">
          <label>Patient ID</label>
          <input type="text" id="patientId" placeholder="e.g. PT-00482">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Known allergies</label>
          <input type="text" id="patientAllergies" placeholder="e.g. penicillin, sulfa drugs">
        </div>
      </div>

      <div class="panel">
        <h2>Prescriber</h2>
        <div class="field">
          <label class="req">Doctor name</label>
          <input type="text" id="doctorName" required placeholder="Dr.">
        </div>
        <div class="field">
          <label class="req">License / registration no.</label>
          <input type="text" id="doctorLicense" required>
        </div>
        <div class="field">
          <label>Clinic / facility</label>
          <input type="text" id="clinicName">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Date issued</label>
          <input type="date" id="rxDate">
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Medications</h2>
      <div id="medList"></div>
      <button type="button" class="btn btn-add" id="addMed">+ Add medication</button>
      <div class="field" style="margin-top:18px; margin-bottom:0;">
        <label>Additional instructions for pharmacist / patient</label>
        <textarea id="notes" placeholder="e.g. take with food; review in 2 weeks"></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary">Generate prescription</button>
      <button type="button" class="btn btn-ghost" id="resetBtn">Clear form</button>
    </div>
  </form>

  <div id="preview-wrap">
    <div class="pad" id="pad"></div>
  </div>

</div>

<script>
(function(){
  const medList = document.getElementById('medList');
  let medCount = 0;

  function medTemplate(n){
    const div = document.createElement('div');
    div.className = 'med-row';
    div.dataset.index = n;
    div.innerHTML = `
      <div class="med-index">Medication ${n}</div>
      <button type="button" class="remove-med" title="Remove">Remove</button>
      <div class="med-grid">
        <div class="field" style="margin-bottom:0;">
          <label class="req">Drug name</label>
          <input type="text" class="m-name" required>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label class="req">Strength</label>
          <input type="text" class="m-strength" placeholder="e.g. 500mg" required>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Form</label>
          <select class="m-form">
            <option>Tablet</option><option>Capsule</option><option>Liquid</option>
            <option>Injection</option><option>Topical</option><option>Other</option>
          </select>
        </div>
      </div>
      <div class="med-grid2">
        <div class="field" style="margin-bottom:0;">
          <label class="req">Dosage / frequency</label>
          <input type="text" class="m-freq" placeholder="e.g. 1 tablet, 2x daily" required>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Duration</label>
          <input type="text" class="m-duration" placeholder="e.g. 7 days">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Quantity / refills</label>
          <input type="text" class="m-qty" placeholder="e.g. 14 tabs, 1 refill">
        </div>
      </div>
    `;
    div.querySelector('.remove-med').addEventListener('click', () => {
      div.remove();
      renumberMeds();
    });
    return div;
  }

  function renumberMeds(){
    [...medList.children].forEach((row, i) => {
      row.querySelector('.med-index').textContent = `Medication ${i + 1}`;
    });
  }

  function addMed(){
    medCount++;
    medList.appendChild(medTemplate(medCount));
  }

  document.getElementById('addMed').addEventListener('click', addMed);
  addMed(); // start with one row

  // allergy live flag
  const allergyInput = document.getElementById('patientAllergies');

  // theme toggle
  const themeBtn = document.getElementById('themeToggle');
  themeBtn.addEventListener('click', () => {
    const root = document.documentElement;
    const isDark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
    themeBtn.textContent = isDark ? 'Dark mode' : 'Light mode';
  });

  // reset
  document.getElementById('resetBtn').addEventListener('click', () => {
    document.getElementById('rxForm').reset();
    medList.innerHTML = '';
    medCount = 0;
    addMed();
    document.getElementById('preview-wrap').classList.remove('show');
  });

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function fmtDate(v){
    if(!v) return '—';
    const d = new Date(v + 'T00:00:00');
    return d.toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
  }

  document.getElementById('rxForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const patientName = document.getElementById('patientName').value.trim();
    const patientDob = document.getElementById('patientDob').value;
    const patientId = document.getElementById('patientId').value.trim();
    const allergies = document.getElementById('patientAllergies').value.trim();
    const doctorName = document.getElementById('doctorName').value.trim();
    const doctorLicense = document.getElementById('doctorLicense').value.trim();
    const clinicName = document.getElementById('clinicName').value.trim();
    const rxDate = document.getElementById('rxDate').value;
    const notes = document.getElementById('notes').value.trim();

    const meds = [...medList.children].map(row => ({
      name: row.querySelector('.m-name').value.trim(),
      strength: row.querySelector('.m-strength').value.trim(),
      form: row.querySelector('.m-form').value,
      freq: row.querySelector('.m-freq').value.trim(),
      duration: row.querySelector('.m-duration').value.trim(),
      qty: row.querySelector('.m-qty').value.trim(),
    })).filter(m => m.name);

    if(!patientName || !patientDob || !doctorName || !doctorLicense || meds.length === 0){
      const pad = document.getElementById('pad');
      pad.innerHTML = `<div style="color:var(--danger); font-size:14px;">Fill in patient name, date of birth, doctor name, license number, and at least one medication before generating.</div>`;
      document.getElementById('preview-wrap').classList.add('show');
      document.getElementById('preview-wrap').scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }

    const rxId = 'RX-' + Date.now().toString().slice(-8);

    const medHtml = meds.map(m => `
      <div class="pad-med">
        <div class="name">${esc(m.name)}${m.strength ? ' — ' + esc(m.strength) : ''}${m.form ? ' (' + esc(m.form) + ')' : ''}</div>
        <div class="detail">${esc(m.freq)}${m.duration ? ' · ' + esc(m.duration) : ''}${m.qty ? ' · ' + esc(m.qty) : ''}</div>
      </div>
    `).join('');

    document.getElementById('pad').innerHTML = `
      <div class="pad-head">
        <div class="clinic">${esc(clinicName) || 'E-Prescription System'}</div>
        <div class="date">Issued ${fmtDate(rxDate)}</div>
      </div>
      <div class="pad-parties">
        <div>
          <div class="k">Patient</div>
          <div class="v">${esc(patientName)}</div>
          <div style="color:var(--ink-soft); font-size:13px; margin-top:4px;">
            DOB ${fmtDate(patientDob)}${patientId ? ' · ID ' + esc(patientId) : ''}
          </div>
        </div>
        <div>
          <div class="k">Prescriber</div>
          <div class="v">${esc(doctorName)}</div>
          <div style="color:var(--ink-soft); font-size:13px; margin-top:4px;">
            Lic. ${esc(doctorLicense)}
          </div>
        </div>
      </div>
      ${allergies ? `<div class="pad-allergy show">⚠ Known allergies: ${esc(allergies)}</div>` : ''}
      <div class="rx-symbol">℞</div>
      ${medHtml}
      ${notes ? `<div class="pad-notes"><strong>Instructions:</strong>\n${esc(notes)}</div>` : ''}
      <div class="pad-sign">
        <div class="pad-id">${rxId}</div>
        <div class="sign-line">${esc(doctorName)} — signature</div>
      </div>
    `;

    document.getElementById('preview-wrap').classList.add('show');
    document.getElementById('preview-wrap').scrollIntoView({behavior:'smooth', block:'start'});
  });
})();
</script>
</body>
</html>
