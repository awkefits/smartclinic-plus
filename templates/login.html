{% extends "base.html" %}
{% block title %}Log in - SmartClinic+{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-body shadow-sm">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="SmartClinic+" class="img-fluid mx-auto"
           style="max-width: 260px; margin: -60px 0;">
      <h1 class="h3 mb-3 text-center">Log in</h1>

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Log in</button>
      </form>
      <p class="mt-3 mb-0 text-center">No account? <a href="{{ url_for('register') }}">Register as a patient</a></p>
    </div>
  </div>
</div>
{% endblock %}
