{% extends "base.html" %}
{% block title %}Log in - SmartClinic+{% endblock %}
{% block content %}
<div class="sc-auth">
  <div>
    <div class="sc-card p-4 p-md-5">
      <img src="{{ url_for('static', filename='logo-wide.png') }}" alt="SmartClinic+" class="logo img-fluid">
      <h1 class="h4 mb-1 text-center">Welcome back</h1>
      <p class="text-muted text-center mb-4">Log in to SmartClinic+</p>

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Log in</button>
      </form>
      <p class="mt-3 mb-0 text-center">No account? <a href="{{ url_for('register') }}">Register as a patient</a></p>
    </div>
  </div>
</div>
{% endblock %}
