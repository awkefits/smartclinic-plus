{% extends "base.html" %}
{% block title %}Register - SmartClinic+{% endblock %}
{% block content %}
<div class="sc-auth" style="max-width: 520px;">
  <div>
    <div class="sc-card p-4 p-md-5">
      <h1 class="h4 mb-1">Create a patient account</h1>
      <p class="text-muted mb-4">Book appointments and see your prescriptions online.</p>

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="name">Full name</label>
          <input class="form-control" type="text" id="name" name="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="date_of_birth">Date of birth</label>
          <input class="form-control" type="date" id="date_of_birth" name="date_of_birth">
        </div>
        <div class="mb-3">
          <label class="form-label" for="contact_info">Contact info</label>
          <input class="form-control" type="text" id="contact_info" name="contact_info" placeholder="Phone number or address">
        </div>
        <button class="btn btn-primary" type="submit">Register</button>
      </form>
      <p class="mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
